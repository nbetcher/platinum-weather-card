name: 'Build'

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build Master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Build
        run: |
          npm ci
          npm run build
          ls -R dist
      # - name: HACS validation
      #   uses: 'hacs/action@main'
      #   with:
      #     category: 'plugin'
